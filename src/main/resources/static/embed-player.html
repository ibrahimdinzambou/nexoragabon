<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#050505">
    <title>Nexora Player</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #050505;
            --panel: rgba(10, 10, 10, .82);
            --line: rgba(255, 255, 255, .16);
            --text: #f7f3ea;
            --muted: rgba(247, 243, 234, .68);
            --accent: #e7c36d;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-width: 100%;
            height: 100%;
            min-height: 100vh;
            min-height: 100svh;
            margin: 0;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            display: grid;
            grid-template-rows: auto auto minmax(0, 1fr);
            height: 100vh;
            height: 100svh;
        }

        .topbar {
            position: relative;
            z-index: 2;
            grid-row: 1;
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: center;
            gap: 12px;
            padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 10px max(12px, env(safe-area-inset-left));
            background: var(--panel);
            border-bottom: 1px solid var(--line);
            backdrop-filter: blur(16px);
        }

        .title {
            display: grid;
            min-width: 0;
            gap: 2px;
        }

        .brand {
            color: var(--accent);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: .14em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            overflow: hidden;
            color: var(--text);
            font-size: 14px;
            font-weight: 650;
            line-height: 1.2;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .action {
            display: inline-grid;
            min-width: 42px;
            min-height: 42px;
            place-items: center;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: rgba(255, 255, 255, .07);
            color: var(--text);
            text-decoration: none;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .action svg {
            width: 19px;
            height: 19px;
            fill: none;
            stroke: currentColor;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-width: 2;
        }

        .episode-nav {
            position: relative;
            z-index: 2;
            grid-row: 2;
            display: grid;
            grid-template-columns: 42px minmax(0, 1fr) 42px;
            gap: 8px;
            align-items: center;
            padding: 8px max(12px, env(safe-area-inset-right)) 8px max(12px, env(safe-area-inset-left));
            background: rgba(5, 5, 5, .94);
            border-bottom: 1px solid var(--line);
        }

        .episode-nav[hidden] {
            display: none;
        }

        .episode-select {
            min-width: 0;
            width: 100%;
            min-height: 42px;
            padding: 0 12px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: rgba(255, 255, 255, .08);
            color: var(--text);
            font: inherit;
            font-size: 14px;
        }

        .action:disabled {
            opacity: .38;
            cursor: not-allowed;
        }

        .frame-shell {
            position: relative;
            grid-row: 3;
            min-width: 0;
            min-height: 320px;
            overflow: hidden;
            background: #000;
        }

        iframe,
        .empty {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            background: #000;
        }

        .empty {
            display: none;
            place-items: center;
            padding: 24px;
            text-align: center;
        }

        .empty[aria-hidden="false"] {
            display: grid;
        }

        .empty p {
            max-width: 34rem;
            margin: 0;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.45;
        }

        .launch-layer {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(circle at 50% 42%, rgba(231, 195, 109, .18), transparent 34%),
                linear-gradient(180deg, rgba(0, 0, 0, .18), rgba(0, 0, 0, .84));
        }

        .launch-layer[hidden] {
            display: none;
        }

        .launch-panel {
            display: grid;
            width: min(100%, 330px);
            justify-items: center;
            gap: 14px;
            padding: 20px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: rgba(8, 8, 8, .88);
            text-align: center;
            box-shadow: 0 20px 70px rgba(0, 0, 0, .48);
        }

        .launch-panel p {
            margin: 0;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.45;
        }

        .launch-button {
            display: inline-grid;
            min-width: 164px;
            min-height: 48px;
            place-items: center;
            border: 0;
            border-radius: 8px;
            background: var(--accent);
            color: #120f08;
            font: inherit;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: .04em;
            text-transform: uppercase;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        @media (orientation: landscape) and (max-height: 520px) {
            .topbar {
                position: absolute;
                right: 0;
                left: 0;
                background: linear-gradient(180deg, rgba(0, 0, 0, .76), transparent);
                border-bottom: 0;
            }

            body {
                grid-template-rows: minmax(0, 1fr);
            }

            .episode-nav {
                position: absolute;
                right: 0;
                bottom: 0;
                left: 0;
                background: linear-gradient(0deg, rgba(0, 0, 0, .76), transparent);
                border-bottom: 0;
            }

            .frame-shell {
                grid-row: 1;
                min-height: 100vh;
                min-height: 100svh;
            }
        }
    </style>
</head>
<body>
<header class="topbar">
    <div class="title">
        <span class="brand">NEXORA</span>
        <h1 id="playerTitle">Lecteur externe</h1>
    </div>
    <div class="actions">
        <button class="action" id="reloadButton" type="button" aria-label="Recharger">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M21 12a9 9 0 1 1-3-6.7"></path>
                <path d="M21 3v6h-6"></path>
            </svg>
        </button>
        <a class="action" id="directLink" href="#" target="_blank" rel="noopener noreferrer" aria-label="Ouvrir directement">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M14 3h7v7"></path>
                <path d="M10 14 21 3"></path>
                <path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"></path>
            </svg>
        </a>
    </div>
</header>
<nav class="episode-nav" id="episodeNav" aria-label="Episodes" hidden>
    <button class="action" id="prevEpisodeButton" type="button" aria-label="Episode precedent">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m15 18-6-6 6-6"></path>
        </svg>
    </button>
    <select class="episode-select" id="episodeSelect" aria-label="Changer d'episode"></select>
    <button class="action" id="nextEpisodeButton" type="button" aria-label="Episode suivant">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m9 18 6-6-6-6"></path>
        </svg>
    </button>
</nav>
<main class="frame-shell">
    <iframe
        id="externalFrame"
        title="Lecteur externe"
        allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
        allowfullscreen
        webkitallowfullscreen
        referrerpolicy="strict-origin-when-cross-origin"
        sandbox="allow-scripts allow-same-origin allow-forms allow-presentation"
    ></iframe>
    <div class="empty" id="emptyState" aria-hidden="true">
        <p>Lecteur externe indisponible.</p>
    </div>
    <div class="launch-layer" id="launchLayer">
        <div class="launch-panel">
            <p id="launchCopy">Appuyez pour lancer le lecteur dans Nexora.</p>
            <button class="launch-button" id="launchButton" type="button">Lancer</button>
        </div>
    </div>
</main>
<script>
(() => {
    const params = new URLSearchParams(window.location.search);
    let activeSrc = params.get("src") || "";
    let activeTitle = params.get("title") || "Lecteur externe";
    const frame = document.querySelector("#externalFrame");
    const empty = document.querySelector("#emptyState");
    const directLink = document.querySelector("#directLink");
    const reloadButton = document.querySelector("#reloadButton");
    const episodeNav = document.querySelector("#episodeNav");
    const episodeSelect = document.querySelector("#episodeSelect");
    const prevEpisodeButton = document.querySelector("#prevEpisodeButton");
    const nextEpisodeButton = document.querySelector("#nextEpisodeButton");
    const launchLayer = document.querySelector("#launchLayer");
    const launchButton = document.querySelector("#launchButton");
    const launchCopy = document.querySelector("#launchCopy");
    const title = document.querySelector("#playerTitle");
    const nativeOpen = window.open?.bind(window);
    const allowedNavigationHosts = new Set(["nexoragabon.com", "www.nexoragabon.com"]);
    let episodeEntries = [];
    let activeEpisodeIndex = -1;
    let frameStarted = false;

    function validExternalUrl(value) {
        try {
            const url = new URL(value);
            return ["http:", "https:"].includes(url.protocol) ? url.href : "";
        } catch {
            return "";
        }
    }

    function safeTitle(value) {
        return String(value || "Lecteur externe").slice(0, 90);
    }

    function launchText() {
        const type = String(params.get("type") || "").toLowerCase();
        if (type === "movie") return "Appuyez pour lancer le film dans Nexora.";
        if (type === "series") return "Appuyez pour lancer cet episode dans Nexora.";
        return "Appuyez pour lancer le lecteur dans Nexora.";
    }

    function escapeHtml(value) {
        return String(value || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");
    }

    function guardedOpen(value, target = "_blank", features) {
        const href = validExternalUrl(value);
        if (!href) return null;
        const url = new URL(href);
        if (!isAllowedNavigationUrl(url)) return null;
        if (nativeOpen) return nativeOpen(href, target || "_self", features);
        return null;
    }

    function isAllowedNavigationUrl(value) {
        try {
            const url = value instanceof URL ? value : new URL(value, window.location.href);
            if (!["http:", "https:"].includes(url.protocol)) return true;
            const host = url.hostname.toLowerCase();
            if (allowedNavigationHosts.has(host)) return true;
            const currentHost = window.location.hostname.toLowerCase();
            const localDevelopment = ["localhost", "127.0.0.1", "::1"].includes(currentHost);
            return localDevelopment && host === currentHost;
        } catch {
            return false;
        }
    }

    function blockExternalNavigation(value, event) {
        if (isAllowedNavigationUrl(value)) return false;
        event?.preventDefault?.();
        event?.stopPropagation?.();
        return true;
    }

    function installRedirectGuard() {
        if (nativeOpen) {
            window.open = function guardedWindowOpen(value, target, features) {
                return guardedOpen(value, target || "_blank", features);
            };
        }
        document.addEventListener("click", (event) => {
            const link = event.target.closest?.("a[href]");
            if (!link) return;
            const href = validExternalUrl(link.href);
            if (!href) return;
            blockExternalNavigation(href, event);
        }, true);
        document.addEventListener("submit", (event) => {
            const form = event.target;
            if (!(form instanceof HTMLFormElement) || !form.action) return;
            blockExternalNavigation(form.action, event);
        }, true);
        try {
            const originalPushState = history.pushState.bind(history);
            const originalReplaceState = history.replaceState.bind(history);
            history.pushState = function guardedPushState(state, unused, url) {
                return originalPushState(state, unused, sameOriginHistoryUrl(url));
            };
            history.replaceState = function guardedReplaceState(state, unused, url) {
                return originalReplaceState(state, unused, sameOriginHistoryUrl(url));
            };
        } catch {
            // Some browsers expose history methods as non-writable.
        }
    }

    function sameOriginHistoryUrl(value) {
        if (!value) return value;
        try {
            const url = new URL(value, window.location.href);
            return isAllowedNavigationUrl(url) ? url.href : window.location.href;
        } catch {
            return window.location.href;
        }
    }

    function episodeStorageKey() {
        return params.get("episodeSet") || "";
    }

    function loadEpisodeEntries() {
        const key = episodeStorageKey();
        if (!key) return [];
        try {
            const payload = JSON.parse(sessionStorage.getItem(key) || "{}");
            const entries = Array.isArray(payload.episodes) ? payload.episodes : [];
            return entries
                .map((entry, index) => ({
                    title: safeTitle(entry.title || `Episode ${index + 1}`),
                    season: Number(entry.season || 0),
                    episode: Number(entry.episode || index + 1),
                    src: validExternalUrl(entry.src),
                    active: Boolean(entry.active)
                }))
                .filter((entry) => entry.src);
        } catch {
            return [];
        }
    }

    function findActiveEpisodeIndex() {
        const current = validExternalUrl(activeSrc);
        const bySrc = episodeEntries.findIndex((entry) => entry.src === current);
        if (bySrc >= 0) return bySrc;
        const season = Number(params.get("season") || 0);
        const episode = Number(params.get("episode") || 0);
        const byNumber = episodeEntries.findIndex((entry) => (
            entry.season === season && entry.episode === episode
        ));
        if (byNumber >= 0) return byNumber;
        return episodeEntries.findIndex((entry) => entry.active);
    }

    function syncAddress() {
        try {
            const url = new URL(window.location.href);
            url.searchParams.set("src", activeSrc);
            url.searchParams.set("title", activeTitle);
            const active = episodeEntries[activeEpisodeIndex];
            if (active?.season) url.searchParams.set("season", String(active.season));
            if (active?.episode) url.searchParams.set("episode", String(active.episode));
            history.replaceState({}, "", url.href);
        } catch {
            // The player can keep working even when the visible URL is unchanged.
        }
    }

    function renderEpisodeNav() {
        if (!episodeNav || episodeEntries.length < 2) return;
        activeEpisodeIndex = findActiveEpisodeIndex();
        if (activeEpisodeIndex < 0) activeEpisodeIndex = 0;
        episodeNav.hidden = false;
        episodeSelect.innerHTML = episodeEntries.map((entry, index) => (
            `<option value="${index}">${escapeHtml(entry.title)}</option>`
        )).join("");
        episodeSelect.value = String(activeEpisodeIndex);
        prevEpisodeButton.disabled = activeEpisodeIndex <= 0;
        nextEpisodeButton.disabled = activeEpisodeIndex >= episodeEntries.length - 1;
    }

    function playEpisodeAt(index) {
        const entry = episodeEntries[index];
        if (!entry) return;
        activeEpisodeIndex = index;
        activeSrc = entry.src;
        activeTitle = entry.title;
        syncAddress();
        renderEpisodeNav();
        startFrame();
    }

    function showEmpty() {
        frame.hidden = true;
        empty.setAttribute("aria-hidden", "false");
        directLink.removeAttribute("href");
    }

    function loadFrame() {
        const src = validExternalUrl(activeSrc);
        if (!src) {
            showEmpty();
            return;
        }
        title.textContent = safeTitle(activeTitle);
        directLink.href = "/watch.html";
        frame.hidden = false;
        empty.setAttribute("aria-hidden", "true");
        frame.src = "about:blank";
        window.setTimeout(() => {
            frame.src = src;
        }, 60);
    }

    function startFrame() {
        frameStarted = true;
        launchLayer.hidden = true;
        loadFrame();
    }

    installRedirectGuard();
    episodeEntries = loadEpisodeEntries();
    renderEpisodeNav();
    launchCopy.textContent = launchText();
    reloadButton.addEventListener("click", startFrame);
    launchButton.addEventListener("click", startFrame);
    episodeSelect?.addEventListener("change", () => playEpisodeAt(Number(episodeSelect.value)));
    prevEpisodeButton?.addEventListener("click", () => playEpisodeAt(activeEpisodeIndex - 1));
    nextEpisodeButton?.addEventListener("click", () => playEpisodeAt(activeEpisodeIndex + 1));
    title.textContent = safeTitle(activeTitle);
    directLink.href = "/watch.html";
    frame.hidden = true;
})();
</script>
</body>
</html>
