proxy_cache_path /var/cache/nginx/nexora-external
    levels=1:2
    keys_zone=nexora_external:20m
    max_size=250m
    inactive=30m
    use_temp_path=off;

map $http_origin $anime_nexora_cors_origin {
    default "";
    ~^https://(www\.)?nexoragabon\.com$ $http_origin;
}

map $http_origin $content_nexora_cors_origin {
    default "";
    ~^https://(www\.)?nexoragabon\.com$ $http_origin;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.nexoragabon.com content.nexoragabon.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.nexoragabon.com;

    ssl_certificate /etc/letsencrypt/live/api.nexoragabon.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.nexoragabon.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:NexoraSSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 128m;

    location /drama-api/ {
        proxy_pass http://127.0.0.1:5000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30;
        proxy_read_timeout 120;
        proxy_send_timeout 120;
    }

    location /anime-api/ {
        proxy_pass http://127.0.0.1:5001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering on;
        proxy_connect_timeout 30;
        proxy_read_timeout 60;
        proxy_send_timeout 60;
        proxy_cache nexora_external;
        proxy_cache_key "$scheme$proxy_host$request_uri";
        proxy_cache_lock on;
        proxy_cache_lock_timeout 30s;
        proxy_cache_background_update on;
        proxy_cache_revalidate on;
        proxy_cache_valid 200 10m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Nexora-Cache $upstream_cache_status always;

        add_header Access-Control-Allow-Origin $anime_nexora_cors_origin always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Accept, Content-Type" always;
        add_header Vary "Origin" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Relais Content-Nexora sous l'hote API principal. Cela evite de bloquer
    # les appels navigateur lorsque le certificat du sous-domaine Content est
    # absent ou en cours de renouvellement.
    location /content-api/ {
        proxy_pass http://127.0.0.1:8787/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering on;
        proxy_connect_timeout 30;
        proxy_read_timeout 45;
        proxy_send_timeout 45;
        proxy_cache nexora_external;
        proxy_cache_key "$scheme$proxy_host$request_uri";
        proxy_cache_methods GET HEAD;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 30s;
        proxy_cache_background_update on;
        proxy_cache_revalidate on;
        proxy_cache_valid 200 3m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Nexora-Cache $upstream_cache_status always;

        add_header Access-Control-Allow-Origin $content_nexora_cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Accept, Content-Type, Origin" always;
        add_header Vary "Origin" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300;
        proxy_send_timeout 300;

        # Spring Security owns CORS for /api/**. Adding the same headers here
        # produces two Access-Control-Allow-Origin values on proxied responses,
        # which browsers reject even when both values are identical.
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }
}

# Content-Nexora est expose sur un sous-domaine dedie car son lecteur utilise
# les chemins absolus / et /api/.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name content.nexoragabon.com;

    ssl_certificate /etc/letsencrypt/live/content.nexoragabon.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/content.nexoragabon.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:NexoraSSL:10m;
    ssl_session_timeout 1d;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_connect_timeout 30;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
        add_header Access-Control-Allow-Origin $content_nexora_cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Accept, Content-Type, Origin" always;
        add_header Vary "Origin" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }
}
